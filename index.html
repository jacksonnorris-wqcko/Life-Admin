<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Life Admin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div>
    <div class="eyebrow">LIFE ADMIN</div>
    <h1>Good morning<span id="userName"></span></h1>
  </div>
  <button type="button" class="icon-btn" id="settingsBtn" aria-label="Settings" data-icon="settings"></button>
</header>

<main>
  <section class="hero-card">
    <div class="hero-top">
      <div>
        <span class="hero-label">YOUR LIFE ADMIN</span>
        <div class="score-row"><strong id="score">100%</strong><span id="scoreText">Under control</span></div>
      </div>
      <div class="ring" id="scoreRing"><span id="ringValue">100</span></div>
    </div>
    <div class="progress"><span id="scoreProgress"></span></div>
    <p id="scoreDetail">Nothing urgent.</p>
  </section>

  <section class="stats-grid">
    <button type="button" class="stat-card" data-filter="overdue"><span class="stat-icon danger" data-icon="warning"></span><b id="overdueCount">0</b><small>Overdue</small></button>
    <button type="button" class="stat-card" data-filter="soon"><span class="stat-icon warning" data-icon="calendar"></span><b id="soonCount">0</b><small>Due soon</small></button>
    <button type="button" class="stat-card" data-filter="all"><span class="stat-icon good" data-icon="check"></span><b id="completeCount">0</b><small>Completed</small></button>
    <button type="button" class="stat-card" data-filter="cost"><span class="stat-icon blue" data-icon="money"></span><b id="costCount">$0</b><small>Outgoing soon</small></button>
    <button type="button" class="stat-card" data-filter="income"><span class="stat-icon income" data-icon="income"></span><b id="incomeCount">$0</b><small>Incoming soon</small></button>
  </section>

  <section class="search-wrap">
    <span data-icon="search"></span>
    <input id="searchInput" placeholder="Search your life admin..." autocomplete="off">
    <button id="clearSearch" class="clear-search hidden" aria-label="Clear search" data-icon="close"></button>
  </section>

  <section class="category-strip" id="categoryStrip">
    <button type="button" class="category-chip active" data-category="all"><span data-icon="grid"></span>All</button>
    <button type="button" class="category-chip" data-category="home"><span data-icon="home"></span>Home</button>
    <button type="button" class="category-chip" data-category="car"><span data-icon="car"></span>Car</button>
    <button type="button" class="category-chip" data-category="money"><span data-icon="money"></span>Money</button>
    <button type="button" class="category-chip" data-category="personal"><span data-icon="personal"></span>Personal</button>
    <button type="button" class="category-chip" data-category="family"><span data-icon="family"></span>Family</button>
    <button type="button" class="category-chip" data-category="other"><span data-icon="other"></span>Other</button>
    <button type="button" class="category-chip" data-category="income"><span data-icon="income"></span>Income</button>
  </section>

  <section class="section-head">
    <div><h2 id="listTitle">Needs attention</h2><p id="listSubtitle">Things coming up soon</p></div>
    <button type="button" class="text-btn" id="viewAllBtn">View all</button>
  </section>
  <section id="itemList" class="item-list"></section>

  <section class="cost-card">
    <div><div><span class="mini-label">UPCOMING COSTS</span><strong id="upcomingCost">$0</strong></div><span data-icon="chart"></span></div>
    <div class="cost-breakdown"><span><b id="monthCost">$0</b><small>next 30 days</small></span><span><b id="yearCost">$0</b><small>next 12 months</small></span></div>
  </section>
  <section class="income-card">
    <div class="income-top"><div><span class="mini-label">INCOMING MONEY</span><strong id="incomingTotal">$0</strong></div><span data-icon="income"></span></div>
    <div class="income-breakdown"><span><b id="weeklyIncome">$0</b><small>weekly</small></span><span><b id="monthlyIncome">$0</b><small>monthly</small></span><span><b id="annualIncome">$0</b><small>annual</small></span></div>
  </section>
</main>

<nav class="bottom-nav">
  <button type="button" class="nav-item active" data-tab="home"><span class="nav-icon" data-icon="home"></span>Home</button>
  <button type="button" class="nav-item" data-tab="items"><span class="nav-icon" data-icon="items"></span>Items</button>
  <button type="button" class="nav-add" id="navAdd" aria-label="Add"><span data-icon="add"></span></button>
  <button type="button" class="nav-item" data-tab="categories"><span class="nav-icon" data-icon="grid"></span>Categories</button>
  <button type="button" class="nav-item" data-tab="settings"><span class="nav-icon" data-icon="settings"></span>Settings</button>
</nav>
</div>

<div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<input id="fileInput" type="file" accept="image/*,.pdf,.txt,.doc,.docx" hidden>
<script src="app.js?v=3101" defer></script>
</body>
</html>
